[package]
name = "dnoise"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
rayon = "1.12.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
# NOTE: the `timscompress` feature (needed to read compression-type-3 / zstd+bitshuffle
# .d files) is omitted because the published `timscompress` crate (0.1.0) is an empty
# placeholder, so the feature does not compile. dnoise reads type-2 / uncompressed input
# and always writes type-2; type-3 input support is blocked on upstream publishing timscompress.
timsrust = { version = "0.4.2" }
toml = "1.1.2"
zstd = "0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized build with debug symbols for profiling (cargo flamegraph --profile profiling).
# Leaves the shipped `release` profile untouched.
[profile.profiling]
inherits = "release"
debug = true
