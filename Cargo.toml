[workspace]
members = ["dnoise-gui"]
resolver = "2"

[package]
name = "dnoise"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Patrick Garrett <pgarrett@scripps.edu>"]
description = "Denoise Bruker timsTOF .d folders with an iterative vertical ion-mobility feature filter (CLI + library)."
repository = "https://github.com/pgarrett-scripps/dnoise"
homepage = "https://github.com/pgarrett-scripps/dnoise"
documentation = "https://docs.rs/dnoise"
readme = "README.md"
license = "MIT"
keywords = ["mass-spectrometry", "proteomics", "timstof", "denoising", "bruker"]
categories = ["science", "command-line-utilities"]
exclude = ["/.github", "/dnoise-gui", "/docs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["cli"]
# The `dnoise` command-line binary and its dependencies. Disable
# (`--no-default-features`) to build only the library.
cli = [
    "config",
    "dep:anyhow",
    "dep:clap",
    "dep:indicatif",
    "dep:serde_json",
    "dep:tracing-subscriber",
]
# On-disk `dnoise.toml` config (the `config` module). Pulls in serde + toml. The
# CLI needs it; the GUI opts in explicitly to share the same schema.
config = ["dep:serde", "dep:toml"]

[[bin]]
name = "dnoise"
required-features = ["cli"]

[dependencies]
# Library dependencies.
rayon = "1.12.0"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0.18"
timsrust = { version = "0.4.2" }
# Structured logging facade. Zero-cost when no subscriber is installed (e.g. when
# dnoise is used purely as a library), so the core has no runtime logging overhead
# unless a binary opts in. The CLI installs a subscriber via `tracing-subscriber`.
tracing = "0.1"
zstd = "0.13.3"

# CLI-only dependencies (enabled by the `cli` feature).
anyhow = { version = "1.0.102", optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
indicatif = { version = "0.18.4", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
toml = { version = "1.1.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized build with debug symbols for profiling (cargo flamegraph --profile profiling).
# Leaves the shipped `release` profile untouched.
[profile.profiling]
inherits = "release"
debug = true
