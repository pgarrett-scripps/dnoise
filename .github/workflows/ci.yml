name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries the egui/eframe GUI links against on Linux.
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Cargo.toml advertises rust-version = "1.85" as the minimum supported
  # compiler, and nothing checked it: a 2024-edition feature stabilized after
  # 1.85 could land and break only for the people who trusted that field.
  # The library alone, because the GUI has its own much newer toolchain floor.
  msrv:
    name: MSRV (1.85, library + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Windows breakage (path handling, linker, the winresource build script) used
  # to surface only at release time. No fmt/clippy here, those are
  # platform-independent and the Linux job enforces them.
  windows:
    name: windows check + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  # What a crate consumer actually gets. `cargo test --workspace` always builds
  # with default features, so nothing here exercised the library without the CLI
  # -- and the feature gating is hand-written, so it can and does drift.
  no-default-features:
    name: library only (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo test --no-default-features --lib
