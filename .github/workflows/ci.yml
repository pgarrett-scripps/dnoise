name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # System libraries the egui/eframe GUI links against on Linux.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +1.97.1 fmt --all --check

      - name: Clippy
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +1.97.1 test --workspace --locked

  # Cargo.toml advertises rust-version = "1.85" as the minimum supported
  # compiler, and nothing checked it: a 2024-edition feature stabilized after
  # 1.85 could land and break only for the people who trusted that field.
  # The library alone, because the GUI has its own much newer toolchain floor.
  msrv:
    name: MSRV (1.85, library + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85.0 check -p dnoise -p dnoise-core --all-targets --locked

  # What a crate consumer actually gets. `cargo +1.97.1 test --workspace --locked` always builds
  # with default features, so nothing here exercised the library without the CLI
  # -- and the feature gating is hand-written, so it can and does drift.
  no-default-features:
    name: library only (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable check --no-default-features --locked
      - run: cargo +stable test --no-default-features --lib --locked

  # sage-plus embeds dnoise-core next to its own timsrust and SQLite; the core
  # must stay free of I/O and native code (and of rayon, whose rayon-core has
  # a `links` key).
  core-deps:
    name: dnoise-core has no I/O or native dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/check-core-deps.sh

  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable test --locked -p dnoise -p dnoise-core

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable install cargo-audit --locked
      - run: cargo +stable audit

  verifier-tests:
    name: SDK comparison logic (no proprietary SDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/requirements-validation.txt
      - run: python -m unittest discover -s examples -p 'test_validate_acquisitions.py'

  # CITATION.cff's version is filled in by `just cite-sync` at release; this
  # catches a release that bumped Cargo.toml and forgot it (same check as
  # `just cite-check`).
  citation:
    name: CITATION.cff matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cff=$(sed -n 's/^version: //p' CITATION.cff)
          grep -Eq '^date-released: "[0-9]{4}-[0-9]{2}-[0-9]{2}"$' CITATION.cff || { echo "CITATION.cff: missing or malformed date-released"; exit 1; }
          [ "$crate" = "$cff" ] || { echo "CITATION.cff version $cff != Cargo.toml $crate: run just cite-sync"; exit 1; }
