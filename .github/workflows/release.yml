name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build and attach
# per-OS binaries (dnoise CLI + dnoise-gui) to the GitHub release, and publish the
# `dnoise` crate to crates.io. Manual runs build the same artifacts and upload them
# as workflow artifacts only (no crates.io publish).
#
# The publish job needs a crates.io API token stored as the repository secret
# CARGO_REGISTRY_TOKEN (cargo reads it from the environment automatically).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target_name: macos-arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --bins

      - name: Package
        shell: bash
        run: |
          stage="dnoise-${{ matrix.target_name }}"
          mkdir -p "$stage" dist
          cp "target/release/dnoise${{ matrix.ext }}" "$stage"/
          cp "target/release/dnoise-gui${{ matrix.ext }}" "$stage"/
          cp README.md LICENSE "$stage"/ 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$stage.zip" "$stage"
          else
            tar czf "dist/$stage.tar.gz" "$stage"
          fi

      # The Windows leg also ships an Inno Setup installer (per-user, optional
      # Explorer context menu on .d folders + PATH). It lands in dist/ so the
      # existing upload and release-attach steps pick it up unchanged.
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup 6 is preinstalled on windows-latest images; choco is an
          # idempotent fallback in case an image drops it.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc /DAppVersion=$version /Odist installer\dnoise.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Smoke test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\dnoise-setup-*.exe | Select-Object -First 1
          Start-Process -Wait $setup.FullName -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=contextmenu,addtopath'
          $app = "$env:LOCALAPPDATA\Programs\dnoise"
          foreach ($f in 'dnoise.exe','dnoise-gui.exe') {
            if (-not (Test-Path "$app\$f")) { throw "$f missing after install" }
          }
          & "$app\dnoise.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "dnoise --version failed" }
          reg query "HKCU\Software\Classes\Directory\shell\dnoise" /v AppliesTo
          if ($LASTEXITCODE -ne 0) { throw "AppliesTo value missing" }
          reg query "HKCU\Software\Classes\Directory\shell\dnoise\command" /ve
          if ($LASTEXITCODE -ne 0) { throw "command key missing" }
          # The uninstaller respawns itself as a temp copy and the original
          # process exits early, so poll for cleanup instead of trusting -Wait.
          Start-Process -Wait "$app\unins000.exe" -ArgumentList `
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\dnoise.exe") -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path "$app\dnoise.exe") { throw "uninstall left dnoise.exe behind" }
          reg query "HKCU\Software\Classes\Directory\shell\dnoise" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "context menu key survived uninstall" }
          exit 0

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnoise-${{ matrix.target_name }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish-crate:
    name: publish dnoise to crates.io
    # Only on tag pushes, and only after the binaries build cleanly on all targets.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package dnoise
