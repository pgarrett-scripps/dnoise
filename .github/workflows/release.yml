name: Release

# Publish a GitHub release (the UI's "Draft a new release", or `gh release
# create v0.3.0 --notes-file <(...)`) and this runs. Creating the release makes
# the tag, so there is nothing to tag separately: the release IS the trigger.
# It builds per-OS binaries (dnoise CLI + dnoise-gui), attaches them to that
# release, and publishes the `dnoise` crate to crates.io. Draft releases do not
# fire; publishing one later does.
#
# Manual runs (workflow_dispatch) build the same artifacts and upload them as
# workflow artifacts only, releasing and publishing nothing.
#
# The per-OS builds are a matrix, and the matrix never touches the release:
# three runners racing to attach assets to one release is how you get a
# half-populated release. One job downloads all three archives, checks it has
# all three, attaches them, and only then publishes the crate. That order is
# deliberate: assets can be replaced and a release can be deleted, but a crate
# version cannot be unpublished, only yanked.
#
# Publishing needs a crates.io API token in the repository secret
# CARGO_REGISTRY_TOKEN (cargo reads it from the environment automatically).
# Zenodo mints its DOI from the published release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target_name: macos-arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      - name: Test before packaging
        run: cargo +1.97.1 test --workspace --locked

      - name: Build release binaries
        run: cargo +1.97.1 build --release --workspace --bins --locked

      - name: Package
        shell: bash
        run: |
          stage="dnoise-${{ matrix.target_name }}"
          mkdir -p "$stage" dist
          cp "target/release/dnoise${{ matrix.ext }}" "$stage"/
          cp "target/release/dnoise-gui${{ matrix.ext }}" "$stage"/
          cp README.md LICENSE "$stage"/ 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$stage.zip" "$stage"
          else
            tar czf "dist/$stage.tar.gz" "$stage"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dnoise-${{ matrix.target_name }}
          path: dist/*

  release:
    name: attach the binaries and publish the crate
    # Skipped on workflow_dispatch: there is no release to attach anything to.
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every matrix job's package, back in one place. Each uploaded its own
      # named artifact containing a single archive; flatten them into dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: dnoise-*
          path: artifacts
          merge-multiple: true

      - name: Collect the archives
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          ls -l dist
          # Three targets, three archives. Fewer means a matrix job produced
          # nothing and the release would ship incomplete.
          count=$(find dist -type f | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "expected 3 archives, found $count" >&2
            exit 1
          fi

      # The release names the version; Cargo.toml has to agree, or the crate
      # published below would not be the thing the release says it is.
      - name: Tag and crate version must match
        run: |
          tag="${{ github.event.release.tag_name }}"
          want="${tag#v}"
          have=$(cargo metadata --no-deps --format-version 1 \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$want" != "$have" ]; then
            echo "release is tagged $tag but Cargo.toml says $have" >&2
            exit 1
          fi

      # Attach to the release that triggered this. The release already carries
      # its own notes, written when it was published, so nothing here touches
      # the body.
      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      # Irreversible step last, and only once the release above exists.
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +1.97.1 publish --package dnoise --locked
