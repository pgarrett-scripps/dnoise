name: Publish existing release crate

# Recover crate publication without moving an already archived release tag or
# rebuilding its binaries. The selected release must already have all downloads.
# Publishes dnoise-core (unless that version is already on crates.io, e.g. when
# only the dnoise publish failed) and then dnoise.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to upload to crates.io (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Verify the published release and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          release = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          assert not release["isDraft"], "release must be published"
          expected = {"dnoise-linux-x86_64.tar.gz", "dnoise-macos-arm64.tar.gz", "dnoise-windows-x86_64.zip"}
          assert expected <= {a["name"] for a in release["assets"] if a["size"] > 0}, "release downloads are incomplete"
          package = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]
          assert package["name"] == "dnoise"
          assert "v" + package["version"] == os.environ["RELEASE_TAG"], "tag and crate version differ"
          core = pathlib.Path("dnoise-core/Cargo.toml")
          if core.exists():  # releases before 0.5.0 have no dnoise-core
              core_package = tomllib.loads(core.read_text())["package"]
              assert core_package["name"] == "dnoise-core"
              assert core_package["version"] == package["version"], "dnoise-core and dnoise versions differ"
          PY
          test -z "$(git status --porcelain)"

      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2

      # dnoise depends on dnoise-core by version, so the core goes first.
      - name: Publish dnoise-core from the release tag
        if: hashFiles('dnoise-core/Cargo.toml') != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          if curl -fsS https://index.crates.io/dn/oi/dnoise-core \
               | python3 -c 'import json,sys; sys.exit(0 if any(json.loads(l)["vers"] == sys.argv[1] for l in sys.stdin if l.strip()) else 1)' "$version"; then
            echo "dnoise-core $version is already on crates.io; skipping"
          else
            cargo +1.97.1 publish --package dnoise-core --locked
          fi

      - name: Publish the crate from the release tag
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +1.97.1 publish --package dnoise --locked
