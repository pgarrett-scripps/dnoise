# Example dnoise config: every recognized key, shown at its built-in default.
# Pass with `dnoise <IN.d> <OUT.d> --config dnoise.toml`.
# Every key is optional, and omitted keys fall back to these defaults. Explicit
# CLI flags override anything set here.

# --- Ion-mobility streak filter (the core denoiser) ---
# Column half-width in TOF indices (window spans [c - w, c + w]).
mz_half_width = 3
# Minimum number of occupied scans in a kept feature (bridged gaps do not count).
min_feature_length = 5
# Max empty scans tolerated inside a feature.
max_internal_gap = 2
# Per-scan summed-intensity floor for occupancy.
min_window_intensity = 0
# Total summed-intensity floor for a kept feature.
min_feature_intensity = 0
# Filter passes (each re-applies to the previous survivors).
iterations = 2

# --- m/z-halo filter (runs after the streak filter, on by default) ---
# Removes the weak m/z halo flanking bright ions (left/right only): each peak is
# compared to the max intensity of its surrounding box EXCLUDING its own TOF
# column, and dropped below `peak_fraction` of that reference. Integer
# (scan, TOF index) space. Set `halo = false` (or pass --no-halo) to disable.
halo = true
# Drop a peak below this fraction of the off-column box-max reference.
halo_peak_fraction = 0.15
# Reference-box half-width along TOF index.
halo_mz_idx_half_width = 80
# Reference-box half-width along ion-mobility scan.
halo_scan_half_width = 2

# --- MS/MS denoising (ddaPASEF only, off by default) ---
# Combine each precursor's fragment scans across frames, filter the combined
# spectrum (streak + halo), and prune the individual scans. Changes MS/MS
# spectra (and identifications). Enable with denoise_msms = true (or --denoise-msms).
denoise_msms = false
msms_mz_half_width = 3
msms_min_feature_length = 3
msms_max_internal_gap = 8
msms_min_window_intensity = 0
msms_min_feature_intensity = 0
msms_iterations = 1

# --- Intensity smoothing (post-halo, pre-watershed, off by default) ---
# Box-average each surviving point's intensity with the mean over its
# (scan, TOF index) neighbourhood. Coordinates are unchanged. Only intensities
# are rewritten. Stabilises the watershed centroider, which otherwise can split
# one ion into several centroids when noise creates local intensity spikes.
# Enable with smooth = true (or pass --smooth).
smooth = false
# Averaging-box half-width along TOF index.
smooth_mz_idx_half_width = 2
# Averaging-box half-width along ion-mobility scan.
smooth_scan_half_width = 3
# Passes over the smoother's own output.
smooth_iterations = 1

# --- Watershed centroider (optional final stage, off by default) ---
# Collapses each filtered frame's surviving points into intensity-weighted
# centroids via watershed segmentation in integer (scan, TOF index) space.
# Unlike the filters above (which keep a subset of points), this is LOSSY: it
# typically shrinks the surviving point count to a small fraction. Applied to
# the same frames the streak filter touches. Enable with watershed = true
# (or pass --watershed).
watershed = false
# Nearest-neighbour reach along the ion-mobility scan axis.
watershed_box_scan = 10
# Nearest-neighbour reach along the TOF-index axis.
watershed_box_mz_idx = 3
# Minimum intensity for a point to open (seed) a new group.
watershed_min_seed_intensity = 0
# Drop groups whose summed intensity is below this.
watershed_min_centroid_total = 0
# Max follower distance from the group seed, in TOF indices.
watershed_max_tof_offset = 10

# --- diaPASEF isolation windows (diaPASEF only) ---
# Drop MS/MS points whose mobility scan falls outside every isolation window
# defined for their frame (DiaFrameMsMsWindows). Out-of-window signal was never
# isolated, so it is noise. Independent of the MS/MS streak filter. No effect on
# ddaPASEF (no DiaFrameMsMs* tables). On by default WHENEVER MS/MS frames are
# filtered (denoise_msms on diaPASEF, or all_frames). A plain MS1-only run leaves
# fragment spectra untouched. Set dia_window = false (or --no-dia-window) to force
# off. dia_window = true forces it on even in MS1-only mode.
# dia_window =
# Scans of leniency added to each side of every window before a point counts as
# out-of-window.
dia_window_scan_pad = 0
# The ddaPASEF twin of dia_window: drop MS/MS points whose mobility scan falls
# outside every PasefFrameMsMsInfo isolation event for their frame. Standard
# timsTOF ddaPASEF acquisitions write MS/MS scans only inside scheduled events,
# so this removes nothing there. It enforces the invariant rather than trusting
# the acquisition. No effect on diaPASEF. Same conditional default as dia_window
# (on whenever MS/MS frames are filtered). dda_window = false (or
# --no-dda-window) forces it off, dda_window = true forces it on.
# dda_window =
# Scans of leniency added to each side of every isolation event.
dda_window_scan_pad = 0
# When the MS/MS filter runs (denoise_msms on diaPASEF, or all_frames), filter
# each isolation window's scan slice independently instead of the whole frame, so
# a mobility run cannot be fused across a window boundary (cross-talk between
# unrelated isolation events). Its default is CONDITIONAL: on whenever MS/MS frames
# are being filtered (denoise_msms or all_frames), off otherwise. That cannot be
# written as a static value, so the key is left unset here and the code default
# applies. Setting dia_per_window = false would switch DIA MS/MS back to whole-frame
# filtering, which is NOT the configuration benchmarked in the paper. Force it either
# way with --dia-per-window / --no-dia-per-window.
# dia_per_window = <conditional, see above>
# Drop MS1 points whose (m/z, mobility) falls outside every isolation window, i.e.
# precursors the method never fragments. Windows are padded in physical units (Da
# and 1/K0) so an edge precursor keeps its full isotopic envelope. No effect on
# ddaPASEF. On by default. Set dia_ms1_window = false (or --no-dia-ms1-window) to
# disable.
dia_ms1_window = true
# m/z leniency added to each side of every window, in Daltons.
dia_ms1_mz_pad = 5.0
# Ion-mobility leniency added to each side of every window, in 1/K0.
dia_ms1_im_pad = 0.05

# --- MS1 selection-polygon gate (ddaPASEF/PASEF) ---
# Drop MS1 points outside the run's instrument selection polygon (the IMS
# PolygonFilter stored in analysis.tdf): the (m/z, 1/K0) region the method
# restricts precursor selection to. Signal outside it is never a precursor
# (background, singly-charged hump, out-of-range ions), so it is MS1 noise. The
# polygon comes from the data and is converted to (scan, TOF index) once via the
# run calibration. On by default. Auto-detected, so it is a silent no-op when the
# run stores no polygon or defines a diaPASEF window scheme. Set ms1_polygon =
# false (or --no-ms1-polygon) to disable.
ms1_polygon = true
# m/z leniency added to each side of the polygon, in Daltons (keeps an edge
# precursor's isotopic envelope). 0 = literal polygon. Default matches the
# diaPASEF MS1 gate's dia_ms1_mz_pad.
ms1_polygon_mz_pad = 5.0
# Ion-mobility leniency added to each side, in 1/K0. 0 = literal polygon.
# Default matches dia_ms1_im_pad.
ms1_polygon_im_pad = 0.05

# --- Experimental pre-filter smoothing ---
# Replace each MS1 frame with the centered running average of its 2r+1
# MS1-frame neighborhood before filtering. 0 = off.
frame_half_width = 0

# --- Region-of-interest crop (all optional, unset = no crop) ---
# A blunt subset of the raw acquisition applied to EVERY frame (MS1 and MS/MS),
# not a denoising step. m/z (Da) and mobility (1/K0) bounds become integer
# (TOF, scan) ranges via the run calibration, intensity is a per-point range, and
# RT bounds (MINUTES) empty out-of-window frames (never delete them, so the frame
# axis stays valid). Leave a key commented for no bound on that side. See --crop-only to
# apply the crop without any denoising.
# mz_min = 400.0
# mz_max = 1000.0
# im_min = 0.7
# im_max = 1.3
# rt_min = 5.0
# rt_max = 60.0
# min_intensity = 100
# max_intensity = 65535
# Apply only the crop and skip all denoising (requires a crop bound above).
crop_only = false

# --- ppm-based m/z window (optional) ---
# Derive mz_half_width from a mass tolerance in ppm, evaluated at a reference m/z
# via the run calibration, instead of a raw TOF-index count. Overrides
# mz_half_width above. Leave commented to use mz_half_width directly.
# mz_ppm = 20.0
# mz_ppm_ref = 800.0   # default: midpoint of the acquired m/z range

# --- Operational ---
# Also filter MS/MS frames (default: MS1 only).
all_frames = false
# Worker threads. Omit (leave commented) to use all cores.
# threads = 8
