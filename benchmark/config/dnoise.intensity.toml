# Strict intensity-threshold baseline (control arm for the streak filter).
#
# This config turns dnoise into a pure, per-point intensity threshold: a point is
# kept iff its own intensity >= min_window_intensity. It is NOT the streak filter.
# It is the naive denoiser the vertical-IM filter is meant to beat: it removes the
# same *number* of MS1 points by brightness alone, with no structural prior.
#
# How the reduction collapses to a threshold (see src/filter.rs::filter_once):
#   mz_half_width = 0       -> the per-scan window is the single TOF column c, so
#                              the window sum at scan s is just that point's own
#                              intensity (one point per (scan, TOF) in a frame).
#   min_feature_length = 1  -> a single occupied scan already forms a kept run.
#   max_internal_gap = 0    -> no bridging; runs are independent points.
#   iterations = 1          -> one pass.
#   halo = false            -> no horizontal-halo stage.
# With these, the occupancy test `profile[s] >= min_window_intensity` is exactly
# `intensity >= T`. MS/MS frames are untouched (all_frames = false), identical to
# the streak MS1 arm, so DDA identifications are unchanged on both arms and the
# comparison is purely about LFQ quality at matched data reduction.
#
# T = 86 was calibrated on the dda_5min runs to match the streak MS1 filter's
# ~84.9% MS1-point removal (control removes 86.0%); see benchmark/justfile `intensity`.

mz_half_width = 0
min_feature_length = 1
max_internal_gap = 0
min_window_intensity = 86
min_feature_intensity = 0
iterations = 1
halo = false
all_frames = false
